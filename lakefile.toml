name = "exposureallocation"
defaultTargets = ["Spec", "Impl", "Proof"]

[leanOptions]
# Required by the harness's "proved" semantics: a passing build must mean
# sorry-free, and `sorry` is a warning.
warningAsError = true
# Tripwire: keep proofs cheap and linear.
maxHeartbeats = 50000

[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Impl"

[[lean_lib]]
name = "Proof"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "main"
